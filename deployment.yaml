apiVersion: apps/v1
kind: Deployment
metadata:
  name: rahul-senapati-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rahul-senapati-app
  template:
    metadata:
      labels:
        app: rahul-senapati-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
